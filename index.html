<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satisfying Animations — Short Film Generator</title>
  <meta name="description" content="Mesmerizing satisfying animations created with p5.js for social media content." />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      overflow: hidden; 
      background: #0a0a0f; 
      width: 100%; 
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas { display: block; }

    /* Control panel overlay */
    #controls {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      font-family: 'Segoe UI', sans-serif;
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 18px 22px;
      color: #e0e0e0;
      min-width: 220px;
      transition: opacity 0.3s;
    }
    #controls h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    #controls button {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: #e0e0e0;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    #controls button:hover {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.25);
      transform: translateX(3px);
    }
    #controls button.active {
      background: rgba(100, 140, 255, 0.2);
      border-color: rgba(100, 140, 255, 0.5);
      color: #fff;
    }
    #controls .hint {
      margin-top: 14px;
      font-size: 11px;
      color: #666;
      line-height: 1.5;
    }
    #controls .hint kbd {
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <h3>🎬 Scenes</h3>
    <button onclick="switchScene(0)" id="btn-0">🔴 Color Sorting Balls</button>
    <button onclick="switchScene(1)" id="btn-1">🌀 Spiral Satisfaction</button>
    <button onclick="switchScene(2)" id="btn-2">💧 Liquid Fill</button>
    <button onclick="switchScene(3)" id="btn-3">⚡ Particle Vortex</button>
    <button onclick="switchScene(4)" id="btn-4">🎯 Pendulum Wave</button>
    <button onclick="switchScene(5)" id="btn-5">🟢 Gravity Balls</button>
    <div class="hint">
      <kbd>H</kbd> Hide/show controls<br/>
      <kbd>SPACE</kbd> Next scene<br/>
      <kbd>R</kbd> Restart scene<br/>
      Record with OBS at 1080p 60fps
    </div>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
