<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satisfying Animations — Short Film Generator</title>
  <meta name="description" content="Mesmerizing satisfying animations created with p5.js for social media content." />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      overflow: hidden; 
      background: #060814; 
      width: 100%; 
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 56.25vh; /* 9:16 aspect ratio */
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas { display: block; }

    /* Control panel overlay */
    #controls {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      font-family: 'Segoe UI', sans-serif;
      background: rgba(10, 10, 20, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 18px 22px;
      color: #e0e0e0;
      min-width: 230px;
      transition: opacity 0.3s;
    }
    #controls h3 {
      margin: 0 0 12px 0;
      font-size: 13px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    #controls button {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: #e0e0e0;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    #controls button:hover {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.25);
      transform: translateX(3px);
    }
    #controls button.active {
      background: rgba(0, 240, 255, 0.2);
      border-color: rgba(0, 240, 255, 0.6);
      color: #fff;
      font-weight: bold;
    }
    #controls .hint {
      margin-top: 12px;
      font-size: 11px;
      color: #777;
      line-height: 1.5;
    }
    #controls .hint kbd {
      background: rgba(255,255,255,0.1);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="controls">
    <h3>🎮 Automated Games & Scenes</h3>
    <button onclick="switchScene(0)" id="btn-0">🏎️ 3D Obstacle Highway</button>
    <button onclick="switchScene(1)" id="btn-1">🔴 Color Sorting Balls</button>
    <button onclick="switchScene(2)" id="btn-2">🌀 Spiral Satisfaction</button>
    <button onclick="switchScene(3)" id="btn-3">💧 Liquid Fill</button>
    <button onclick="switchScene(4)" id="btn-4">⚡ Particle Vortex</button>
    <button onclick="switchScene(5)" id="btn-5">🎯 Pendulum Wave</button>
    <button onclick="switchScene(6)" id="btn-6">🟢 Gravity Balls</button>
    <button onclick="getAudioCtx(); this.innerText = '🔊 Sound Active!';" id="btn-sound" style="margin-top: 8px; border-color: rgba(0, 255, 170, 0.4); color: #8ef5b5;">🔊 Click to Enable Sound</button>
    <div class="hint">
      <kbd>H</kbd> Hide/show controls<br/>
      <kbd>SPACE</kbd> Next scene<br/>
      <kbd>R</kbd> Restart<br/>
      Auto-Pilot Gameplay Active
    </div>
  </div>

  <script src="car-game.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
